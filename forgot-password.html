<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar senha | Angus Grill</title>
    <meta name="description" content="Recupere a senha da sua conta Angus Grill.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css?v=account-route-20260813">
  </head>
  <body class="account-shell" data-account-mode="forgot-password">
    <header class="admin-header account-header">
      <a class="brand" href="index.html" aria-label="Voltar para a página inicial">
        <img src="assets/images/angus-logo-new.png" alt="Angus Grill Premium Meat">
        <div>
          <strong>Angus Grill</strong>
          <span>RECUPERAR SENHA</span>
        </div>
      </a>
      <nav class="header-actions">
        <a href="index.html">Voltar à loja</a>
        <a href="account.html">Fazer login</a>
      </nav>
    </header>

    <main class="account-main account-login-main">
      <section class="account-hero account-auth-hero">
        <p class="eyebrow">Acesso à conta</p>
        <h1>Recuperar senha</h1>
        <p>Digite seu e-mail cadastrado para receber um link de recuperação de senha.</p>
      </section>

      <section class="admin-status" id="accountStatus" role="status" hidden></section>

      <section class="account-auth-layout">
        <article class="account-card account-single-card">
          <p class="eyebrow">Senha</p>
          <h2 id="forgotPasswordTitle">Enviar link</h2>
          <p id="forgotPasswordHelp">Se o e-mail estiver cadastrado, enviaremos as instruções para criar uma nova senha.</p>
          <form class="admin-form" id="forgotPasswordForm">
            <label>
              E-mail
              <input type="email" name="email" autocomplete="email" required>
            </label>
            <button class="primary-button" id="forgotPasswordSubmit" type="submit">Enviar link de recuperação</button>
          </form>
          <div class="account-switch-panel">
            <span>Lembrou sua senha?</span>
            <a href="account.html">Fazer login</a>
          </div>
        </article>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js?v=supabase-admin"></script>
    <script src="assets/js/data.js?v=supabase-admin"></script>
    <script src="assets/js/account.js?v=account-confirmation-route-20260815"></script>
  </body>
</html>
